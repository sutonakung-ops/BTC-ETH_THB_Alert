<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Alert Dashboard</title>
<style>
  :root {
    /* โทนสีอิงจากภาพ: ท้องฟ้ายามฝนตกสีน้ำเงินเข้มเกือบดำ, ผมสีเงิน/เขียวมินต์,
       เกราะโลหะเทาเข้ม, พลอยสีแดงกลางหน้าผาก */
    --bg: #090b10;
    --bg-elevated: #10131a;
    --card: #12161f;
    --card-glow: rgba(110, 196, 180, 0.08);
    --text: #eef1f5;
    --muted: #8894a3;
    --teal: #5fc4ae;
    --teal-dim: rgba(95, 196, 174, 0.15);
    --red: #e0564f;
    --red-dim: rgba(224, 86, 79, 0.15);
    --lavender: #b9aee0;
    --yellow: #e0c35f;
    --border: #1f2630;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse at top, rgba(95,196,174,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    padding-bottom: 48px;
  }
  .hero {
    position: relative;
    height: 240px;
    background-image:
      linear-gradient(180deg, rgba(9,11,16,0.25) 0%, rgba(9,11,16,0.55) 55%, var(--bg) 100%),
      url("assets/hero.webp");
    background-size: cover;
    background-position: center 20%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px 16px;
    border-bottom: 1px solid var(--border);
  }
  .hero h1 {
    margin: 0 0 4px;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  .hero .tagline {
    margin: 0;
    font-size: 0.8rem;
    color: var(--lavender);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    letter-spacing: 0.03em;
  }
  .updated {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin: 20px 0 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    max-width: 840px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .card {
    background: linear-gradient(160deg, var(--card-glow), transparent 60%), var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    transition: border-color 0.2s ease;
  }
  .card:hover { border-color: rgba(95,196,174,0.35); }
  .card h2 {
    margin: 0 0 12px;
    font-size: 1.15rem;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .price {
    font-size: 1.8rem;
    font-weight: 700;
    margin: 4px 0 12px;
    color: var(--text);
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }
  .row:last-child { border-bottom: none; }
  .label { color: var(--muted); }
  .up { color: var(--teal); font-weight: 600; }
  .down { color: var(--red); font-weight: 600; }
  .neutral { color: var(--yellow); font-weight: 600; }
  .signal-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .badge-up { background: var(--teal-dim); color: var(--teal); }
  .badge-down { background: var(--red-dim); color: var(--red); }
  .badge-neutral { background: rgba(224,195,95,0.15); color: var(--yellow); }
  .error {
    text-align: center;
    color: var(--red);
    margin-top: 40px;
  }
  .section-title {
    max-width: 840px;
    margin: 32px auto 12px;
    padding: 0 16px;
    font-size: 0.95rem;
    color: var(--lavender);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .bot-card {
    max-width: 840px;
    margin: 0 auto;
    background: linear-gradient(160deg, var(--card-glow), transparent 60%), var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .bot-status {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .status-on { background: var(--teal-dim); color: var(--teal); }
  .status-off { background: rgba(136,148,163,0.15); color: var(--muted); }
  .status-halted { background: var(--red-dim); color: var(--red); }
  .pending-box {
    background: rgba(224,195,95,0.08);
    border: 1px solid rgba(224,195,95,0.3);
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="hero">
    <h1>📊 Crypto Price Alert Dashboard</h1>
    <p class="tagline">ตรวจราคา · วิเคราะห์เทรนด์ · สะสม DCA อัตโนมัติ</p>
  </div>
  <div class="updated" id="updated">กำลังโหลดข้อมูล...</div>
  <div class="grid" id="grid"></div>

  <div class="section-title">สถานะบอทเทรดอัตโนมัติ (จับจังหวะ)</div>
  <div class="bot-card" id="botCard">กำลังโหลด...</div>

  <div class="section-title">พอร์ต DCA (ซื้อสม่ำเสมอทุกวัน)</div>
  <div class="bot-card" id="dcaCard">กำลังโหลด...</div>

  <script>
    function fmtNum(n) {
      return Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
    }

    function changeClass(val) {
      if (val > 0) return "up";
      if (val < 0) return "down";
      return "neutral";
    }

    function signalClass(signal) {
      if (signal.includes("Golden") || signal.includes("ขาขึ้น")) return "badge-up";
      if (signal.includes("Death") || signal.includes("ขาลง")) return "badge-down";
      return "badge-neutral";
    }

    function renderCoin(name, d) {
      const changeCls = changeClass(d.change_24h);
      const gapCls = changeClass(d.gap_percent);
      return `
        <div class="card">
          <h2>${name}</h2>
          <div class="price">${fmtNum(d.price)} THB</div>
          <div class="row">
            <span class="label">เปลี่ยนแปลง 24 ชม.</span>
            <span class="${changeCls}">${d.change_24h > 0 ? "+" : ""}${d.change_24h}%</span>
          </div>
          <div class="row">
            <span class="label">MA12 / MA24</span>
            <span>${fmtNum(d.ma12)} / ${fmtNum(d.ma24)}</span>
          </div>
          <div class="row">
            <span class="label">ส่วนต่าง MA</span>
            <span class="${gapCls}">${d.gap_percent > 0 ? "+" : ""}${d.gap_percent}%</span>
          </div>
          <div class="signal-badge ${signalClass(d.signal)}">${d.signal}</div>
        </div>
      `;
    }

    function renderBotCard(bot) {
      if (!bot) {
        return `<span class="bot-status status-off">ยังไม่มีข้อมูล</span><div>บอทเทรดยังไม่เคยรัน</div>`;
      }

      let statusHtml;
      if (!bot.enabled) {
        statusHtml = `<span class="bot-status status-off">ยังไม่ตั้งค่า API key — วิเคราะห์อย่างเดียว ไม่เทรดจริง</span>`;
      } else if (bot.daily_risk && bot.daily_risk.halted) {
        statusHtml = `<span class="bot-status status-halted">หยุดเปิดไม้ใหม่วันนี้ (ชนเพดานขาดทุนรายวัน)</span>`;
      } else {
        statusHtml = `<span class="bot-status status-on">ทำงานปกติ</span>`;
      }

      let bodyHtml = "";

      if (bot.position) {
        const p = bot.position;
        bodyHtml += `
          <div class="row"><span class="label">ไม้ที่ถืออยู่</span><span>${p.name}</span></div>
          <div class="row"><span class="label">ราคาเข้า</span><span>${fmtNum(p.entry_price)} บาท</span></div>
          <div class="row"><span class="label">ทุนที่ใช้</span><span>${fmtNum(p.capital_thb)} บาท</span></div>
        `;
      } else {
        bodyHtml += `<div class="row"><span class="label">ไม้ที่ถืออยู่</span><span>ไม่มี (ว่าง)</span></div>`;
      }

      if (bot.pending_signal) {
        const s = bot.pending_signal;
        bodyHtml += `
          <div class="pending-box">
            ⏳ รอยืนยันคำสั่งซื้อ <strong>${s.name}</strong> ที่ราคาสัญญาณ ${fmtNum(s.signal_price)} บาท<br>
            ตอบกลับในแชท Telegram ของบอทว่า "ยืนยัน" หรือ "ยกเลิก"
          </div>
        `;
      }

      if (bot.daily_risk) {
        const pnl = bot.daily_risk.realized_pnl_thb || 0;
        const pnlCls = changeClass(pnl);
        bodyHtml += `
          <div class="row"><span class="label">กำไร/ขาดทุนสะสมวันนี้ (${bot.daily_risk.date || "-"})</span>
          <span class="${pnlCls}">${pnl > 0 ? "+" : ""}${fmtNum(pnl)} บาท</span></div>
        `;
      }

      bodyHtml += `<div class="row"><span class="label">เช็คล่าสุด</span><span>${
        bot.checked_at ? new Date(bot.checked_at).toLocaleString("th-TH", { timeZone: "Asia/Bangkok" }) : "-"
      }</span></div>`;

      return statusHtml + bodyHtml;
    }

    function renderDcaCard(dca) {
      if (!dca) {
        return `<span class="bot-status status-off">ยังไม่มีข้อมูล</span><div>บอท DCA ยังไม่เคยรัน</div>`;
      }

      const statusHtml = dca.enabled
        ? `<span class="bot-status status-on">ทำงานปกติ — ${fmtNum(dca.amount_thb_per_coin_per_period)} บาท/เหรียญ ทุก ${dca.interval_days} วัน | ขายทำกำไรที่ +${dca.take_profit_pct}%</span>`
        : `<span class="bot-status status-off">ยังไม่ตั้งค่า API key — ยังไม่ซื้อจริง</span>`;

      let bodyHtml = "";
      if (dca.total_invested_thb) {
        const pnlCls = changeClass(dca.total_pnl_thb || 0);
        bodyHtml += `
          <div class="row"><span class="label">ลงทุนสะสมรวม</span><span>${fmtNum(dca.total_invested_thb)} บาท</span></div>
          <div class="row"><span class="label">มูลค่าปัจจุบัน</span><span>${dca.total_value_thb != null ? fmtNum(dca.total_value_thb) + " บาท" : "-"}</span></div>
          <div class="row"><span class="label">กำไร/ขาดทุนที่ยังไม่ขาย (unrealized)</span>
            <span class="${pnlCls}">${dca.total_pnl_thb != null ? (dca.total_pnl_thb > 0 ? "+" : "") + fmtNum(dca.total_pnl_thb) + " บาท (" + (dca.total_pnl_pct > 0 ? "+" : "") + dca.total_pnl_pct + "%)" : "-"}</span>
          </div>
        `;
      }
      if (dca.realized_pnl_total_thb) {
        const realizedCls = changeClass(dca.realized_pnl_total_thb);
        bodyHtml += `
          <div class="row"><span class="label">กำไรที่ขายทำแล้ว (realized, สะสม)</span>
            <span class="${realizedCls}">${dca.realized_pnl_total_thb > 0 ? "+" : ""}${fmtNum(dca.realized_pnl_total_thb)} บาท</span>
          </div>
        `;
      } else {
        bodyHtml += `<div class="row"><span class="label">ลงทุนสะสมรวม</span><span>ยังไม่มีการซื้อ</span></div>`;
      }

      if (dca.coins) {
        for (const name in dca.coins) {
          const c = dca.coins[name];
          if (!c.buy_count) continue;
          const pnlCls = changeClass(c.pnl_thb || 0);
          bodyHtml += `
            <div class="row">
              <span class="label">${name} (${c.buy_count} ครั้ง, ล่าสุด ${c.last_bought_date || "-"}, ทุนเฉลี่ย ${c.avg_cost != null ? fmtNum(c.avg_cost) : "-"})</span>
              <span class="${pnlCls}">${c.pnl_thb != null ? (c.pnl_thb > 0 ? "+" : "") + fmtNum(c.pnl_thb) + " บาท" : "-"}</span>
            </div>
          `;
        }
      }

      bodyHtml += `<div class="row"><span class="label">เช็คล่าสุด</span><span>${
        dca.checked_at ? new Date(dca.checked_at).toLocaleString("th-TH", { timeZone: "Asia/Bangkok" }) : "-"
      }</span></div>`;

      return statusHtml + bodyHtml;
    }

    fetch("latest.json?t=" + Date.now())
      .then((res) => {
        if (!res.ok) throw new Error("ไม่พบไฟล์ latest.json");
        return res.json();
      })
      .then((data) => {
        const updatedDate = new Date(data.updated_at);
        document.getElementById("updated").textContent =
          "อัปเดตล่าสุด: " + updatedDate.toLocaleString("th-TH", { timeZone: "Asia/Bangkok" });
        const coinNames = ["BTC", "ETH", "XRP", "ADA", "DOGE", "SOL", "KUB"];
        document.getElementById("grid").innerHTML = coinNames
          .filter((name) => data[name])
          .map((name) => renderCoin(name, data[name]))
          .join("");
        document.getElementById("botCard").innerHTML = renderBotCard(data.trading_bot);
        document.getElementById("dcaCard").innerHTML = renderDcaCard(data.dca_bot);
      })
      .catch((err) => {
        document.getElementById("updated").textContent = "";
        document.getElementById("grid").innerHTML =
          `<div class="error">⚠️ โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`;
      });
  </script>
</body>
</html>
