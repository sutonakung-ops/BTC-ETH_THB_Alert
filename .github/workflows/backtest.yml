name: Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      coin:
        description: "เหรียญที่จะทดสอบ (BTC, ETH, หรือ BTC,ETH)"
        default: "BTC,ETH"
        required: false
      days:
        description: "จำนวนวันย้อนหลัง"
        default: "180"
        required: false
      stop_loss:
        description: "stop-loss %"
        default: "4"
        required: false
      take_profit:
        description: "take-profit %"
        default: "6"
        required: false
      rsi_overbought:
        description: "RSI overbought threshold"
        default: "70"
        required: false
      capital:
        description: "ทุนต่อไม้ (บาท)"
        default: "1000"
        required: false
      sweep:
        description: "ลองหลายชุดพารามิเตอร์แล้วจัดอันดับ (true/false)"
        default: "false"
        required: false
      validate:
        description: "แบ่งข้อมูลครึ่งใหม่/เก่า หา params จากครึ่งใหม่แล้วเช็คกับครึ่งเก่า (true/false)"
        default: "false"
        required: false
      ablation:
        description: "ไล่ทดสอบเปิด/ปิดตัวกรอง RSI/Volume/Trend ทุกชุด (8 แบบ) ด้วย train/test (true/false)"
        default: "false"
        required: false
      resolution:
        description: "ความละเอียดแท่งเทียน (นาที) เช่น 60=1ชม., 240=4ชม."
        default: "60"
        required: false
      offset_days:
        description: "เลื่อนช่วงเวลาย้อนหลังออกไปอีกกี่วัน (ทดสอบ out-of-sample)"
        default: "0"
        required: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Unlock data (ถอดรหัสข้อมูลบอท)
        run: python tools/vault.py unlock

      - name: Run backtest
        run: |
          SWEEP_FLAG=""
          if [ "${{ github.event.inputs.ablation }}" = "true" ]; then
            SWEEP_FLAG="--ablation"
          elif [ "${{ github.event.inputs.validate }}" = "true" ]; then
            SWEEP_FLAG="--validate"
          elif [ "${{ github.event.inputs.sweep }}" = "true" ]; then
            SWEEP_FLAG="--sweep"
          fi
          python tools/vault.py run --log backtest -- python backtest.py \
            --coin "${{ github.event.inputs.coin }}" \
            --days "${{ github.event.inputs.days }}" \
            --capital "${{ github.event.inputs.capital }}" \
            --stop-loss "${{ github.event.inputs.stop_loss }}" \
            --take-profit "${{ github.event.inputs.take_profit }}" \
            --rsi-overbought "${{ github.event.inputs.rsi_overbought }}" \
            --resolution "${{ github.event.inputs.resolution }}" \
            --offset-days "${{ github.event.inputs.offset_days }}" \
            $SWEEP_FLAG

      - name: Commit backtest result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/vault.py lock
          git diff --staged --quiet || git commit -m "Backtest result: coin=${{ github.event.inputs.coin }} days=${{ github.event.inputs.days }} sl=${{ github.event.inputs.stop_loss }} tp=${{ github.event.inputs.take_profit }} rsi=${{ github.event.inputs.rsi_overbought }} ablation=${{ github.event.inputs.ablation }} validate=${{ github.event.inputs.validate }} sweep=${{ github.event.inputs.sweep }} [skip ci]"
          git pull --rebase
          git push
