name: Check wallet vs bot records (read-only)

on:
  workflow_dispatch:

concurrency:
  group: crypto-bot-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check balances
        env:
          BITKUB_API_KEY: ${{ secrets.BITKUB_API_KEY }}
          BITKUB_API_SECRET: ${{ secrets.BITKUB_API_SECRET }}
        run: python tools/check_balances.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/balance_check.json
          git diff --staged --quiet || git commit -m "Balance check [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
